<svg width="1200" height="1750" viewBox="0 0 1200 1750" xmlns="http://www.w3.org/2000/svg">

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#050816"/>
<stop offset="55%" stop-color="#0A1030"/>
<stop offset="100%" stop-color="#111827"/>
</linearGradient>

<radialGradient id="purple" cx="25%" cy="10%" r="70%">
<stop offset="0%" stop-color="#A855F7" stop-opacity=".35"/>
<stop offset="100%" stop-opacity="0"/>
</radialGradient>

<radialGradient id="blue" cx="80%" cy="35%" r="65%">
<stop offset="0%" stop-color="#2563EB" stop-opacity=".25"/>
<stop offset="100%" stop-opacity="0"/>
</radialGradient>

<linearGradient id="accent" x1="0" x2="1">
<stop offset="0%" stop-color="#7DD3FC"/>
<stop offset="100%" stop-color="#D8B4FE"/>
</linearGradient>

<filter id="blur">
<feGaussianBlur stdDeviation="35"/>
</filter>

<clipPath id="heroClip">
<rect x="70" y="90" width="1060" height="530" rx="28"/>
</clipPath>

<style>
.title{font:700 68px 'Segoe UI',Arial;fill:#fff}
.subtitle{font:400 24px 'Segoe UI',Arial;fill:#D1D5DB}
.h{font:700 30px 'Segoe UI',Arial;fill:#fff}
.body{font:400 22px 'Segoe UI',Arial;fill:#D1D5DB}
.small{font:400 18px 'Segoe UI',Arial;fill:#9CA3AF}
.quote{font:italic 34px Georgia;fill:white}
</style>

</defs>

<rect width="1200" height="1750" fill="url(#bg)"/>

<circle cx="240" cy="160" r="340" fill="url(#purple)" filter="url(#blur)"/>
<circle cx="930" cy="330" r="320" fill="url(#blue)" filter="url(#blur)"/>

<!-- animated stars -->
<g fill="white">
<circle cx="120" cy="140" r="2">
<animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
</circle>
<circle cx="980" cy="110" r="2">
<animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/>
</circle>
<circle cx="1030" cy="420" r="3">
<animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="180" cy="510" r="3">
<animate attributeName="opacity" values="1;0.3;1" dur="2.8s" repeatCount="indefinite"/>
</circle>
</g>

<!-- FAVICON -->
<circle cx="600" cy="110" r="42" fill="#08111F" opacity=".85"/>
<image href="favicon.ico" x="560" y="70" width="80" height="80"/>

<!-- HERO IMAGE -->
<image href="opengraph.png"
x="70" y="90"
width="1060" height="530"
clip-path="url(#heroClip)"
preserveAspectRatio="xMidYMid slice"/>

<rect x="70" y="90" width="1060" height="530" rx="28" fill="url(#purple)" opacity=".18"/>

<!-- NAME -->
<text x="600" y="330" text-anchor="middle" class="title">Zachary Scott</text>
<text x="600" y="375" text-anchor="middle" class="subtitle">Designer / Developer</text>

<rect x="430" y="395" width="340" height="5" rx="3" fill="url(#accent)"/>

<!-- TERMINAL -->
<rect x="120" y="660" width="430" height="44" rx="10" fill="#030712" opacity=".9"/>
<circle cx="145" cy="682" r="4" fill="#EF4444"/>
<circle cx="161" cy="682" r="4" fill="#F59E0B"/>
<circle cx="177" cy="682" r="4" fill="#22C55E"/>

<text x="195" y="689" font-family="Consolas" font-size="20" fill="#7DD3FC">
&gt; We learn by doing
</text>

<rect x="470" y="673" width="8" height="18" fill="#7DD3FC">
<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</rect>

<!-- PHILOSOPHY -->
<text x="70" y="760" class="quote">“We learn by doing.”</text>
<text x="72" y="798" class="small">— John Dewey</text>

<rect x="70" y="825" width="1060" height="2" fill="url(#accent)" opacity=".35"/>

<text x="70" y="880" class="h">MY PHILOSOPHY</text>

<text x="70" y="925" class="body">I don't think programming is about remembering everything.</text>
<text x="70" y="960" class="body">If I build an incredible project today and completely forget how I made it later,</text>
<text x="70" y="995" class="body">that doesn't make it any less mine.</text>

<text x="70" y="1045" class="body">Before I started building it, I didn't know how to build it either.</text>
<text x="70" y="1080" class="body">The valuable skill isn't memorising every function or algorithm.</text>
<text x="70" y="1115" class="body">It's believing I can experiment, fail, rebuild, and figure it out again.</text>

<text x="70" y="1170" font-family="Segoe UI" font-size="24" font-weight="700" fill="#7DD3FC">
Programming is confidence in learning.
</text>

<!-- PROJECTS -->
<text x="70" y="1245" class="h">FEATURED PROJECTS</text>

<!-- Roomba -->
<rect x="70" y="1275" width="510" height="260" rx="22" fill="#0B1220" stroke="#38BDF8" stroke-opacity=".25"/>
<image href="roomba.gif"
x="90" y="1295"
width="470" height="140"
preserveAspectRatio="xMidYMid slice"/>

<text x="90" y="1465" font-family="Segoe UI" font-size="24" font-weight="700" fill="white">
Virtual Roomba
</text>
<text x="90" y="1492" class="small">
Autonomous vacuum simulation built in Python.
</text>

<!-- Pixel -->
<rect x="620" y="1275" width="510" height="260" rx="22" fill="#0B1220" stroke="#A78BFA" stroke-opacity=".25"/>
<image href="pixelart.gif"
x="640" y="1295"
width="470" height="140"
preserveAspectRatio="xMidYMid slice"/>

<text x="640" y="1465" font-family="Segoe UI" font-size="24" font-weight="700" fill="white">
Pixel Art Maker
</text>
<text x="640" y="1492" class="small">
Interactive image-to-pixel-art conversion.
</text>

<!-- TECH -->
<text x="70" y="1595" class="h">TECH I ENJOY</text>

<!-- JS -->
<g transform="translate(70 1620)">
<rect width="54" height="54" rx="12" fill="#F7DF1E"/>
<text x="27" y="36" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#111">JS</text>
</g>

<!-- Python -->
<g transform="translate(145 1620)">
<rect width="54" height="54" rx="12" fill="#3776AB"/>
<path d="M16 18c0-4 3-6 8-6h6v8H20c-2 0-4 2-4 4v2h-4v-8z" fill="#FFD43B"/>
<path d="M38 36c0 4-3 6-8 6h-6v-8h10c2 0 4-2 4-4v-2h4v8z" fill="#FFE873"/>
</g>

<!-- HTML -->
<g transform="translate(220 1620)">
<rect width="54" height="54" rx="12" fill="#E34F26"/>
<path d="M14 12h26l-2 30-11 4-11-4-2-30z" fill="#fff" opacity=".9"/>
</g>

<!-- CSS -->
<g transform="translate(295 1620)">
<rect width="54" height="54" rx="12" fill="#1572B6"/>
<path d="M14 12h26l-2 30-11 4-11-4-2-30z" fill="#fff" opacity=".9"/>
</g>

<!-- Git -->
<g transform="translate(370 1620)">
<rect width="54" height="54" rx="12" fill="#F05032"/>
<circle cx="27" cy="27" r="8" fill="white"/>
<path d="M27 15v24M27 27l10 10" stroke="#F05032" stroke-width="2"/>
</g>

<!-- VSCode -->
<g transform="translate(445 1620)">
<rect width="54" height="54" rx="12" fill="#007ACC"/>
<path d="M38 12l-14 12 14 18 6-3V15z" fill="white"/>
<path d="M24 24L12 16l-4 4 10 8-10 8 4 4 12-8" fill="#C7E7FF"/>
</g>

<!-- ABOUT -->
<rect x="620" y="1598" width="510" height="120" rx="18" fill="#0B1220" stroke="#38BDF8" stroke-opacity=".18"/>

<text x="645" y="1630" font-family="Segoe UI" font-size="20" font-weight="700" fill="white">
ABOUT
</text>

<text x="645" y="1660" class="small">Age: 14 • Brisbane, Australia</text>
<text x="645" y="1685" class="small">Almost straight A's • McDonald's Crew</text>
<text x="645" y="1710" class="small">Open to fun collaborations, not long-term work.</text>

</svg>
